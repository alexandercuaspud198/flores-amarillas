          <h1 id="dedication-title">Para ti,<br><em>Lizeth.</em></h1>
          <div class="dedication">
            <p>Lizeth, gracias por llegar a mi vida.</p>
            <p>Quiero compartir contigo mis días, mis sueños y todo lo bonito que nos espera.</p>
            <p>Estas flores son un pequeño recordatorio de <strong>cuánto te amo.</strong></p>
          </div>

            <p id="music-status" class="music-status" role="status"></p>
          </div>
        </div>
